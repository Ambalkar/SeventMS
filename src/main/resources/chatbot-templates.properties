chatbot.greeting=Hi there! Welcome to {platform_name}. I can help you browse events, explain login and booking, show policy details, or share support info.
chatbot.view_events.header=Here are the upcoming events I found:
chatbot.view_events.item=- {event_name} | Date: {event_date} | Venue: {event_location} | Seats left: {seats_left}
chatbot.view_events.empty=I could not find any upcoming events right now. Please check the events page later.
chatbot.view_events.fallback=I could not load live events at the moment. Please check the events page.
chatbot.login.logged_in=You are logged in as {username}. You can browse events and continue booking from the event page.
chatbot.login.logged_out=To book an event, please log in or create an account first. After that, return to the event page and continue booking.
chatbot.policy.header=Here is a quick summary:
chatbot.policy.body=Terms and conditions cover platform use. Privacy policy covers your booking data. Refunds and cancellations follow the event rules shown in the documentation page.
chatbot.policy.fallback=I could not load the policy summary right now. Please check the documentation page.
chatbot.support=For help, contact {support_email}. You can also visit {website_url} for the latest platform details.
chatbot.support.fallback=I could not load support details right now. Please check the documentation page.
